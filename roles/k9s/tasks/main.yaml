---
- name: Get latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/derailed/k9s/releases
    return_content: yes
  check_mode: no
  register: k9s_releases

- name: Install k9s
  vars:
    arch_lookup:
      aarch64: arm64
      x86_64: amd64
  ansible.builtin.yum:
    name: "{{ (k9s_releases.json[0].assets | selectattr('name', 'match', 'k9s_linux_' + arch_lookup[ansible_architecture] + '.rpm'))[0].browser_download_url }}"
    state: installed
    disable_gpg_check: yes
  become: yes
