---
- name: Install PIP
  ansible.builtin.yum:
    name: python3-pip
    state: installed
  become: yes

- name: Install kubernetes pip package
  ansible.builtin.pip:
    name: kubernetes
    state: present
  become: yes

- name: Create argocd namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: namespace
    name: argocd
    state: present
  become: yes

- name: Install ArgoCD
  kubernetes.core.k8s:
    namespace: argocd
    src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    state: present
  become: yes

- name: Configure ArgoCD server for insecure mode
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: ConfigMap
    name: argocd-cmd-params-cm
    namespace: argocd
    definition:
      data:
        server.insecure: "true"
  register: argocd_insecure_configmap
  become: yes

- name: Restart ArgoCD server to pick up insecure mode
  # ConfigMap changes don't propagate to the already-running argocd-server process on their
  # own - only do this when the config actually changed, so repeat runs stay idempotent.
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: argocd
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
  when: argocd_insecure_configmap is changed
  become: yes

- name: Create ingress
  kubernetes.core.k8s:
    state: present
    namespace: argocd
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: argocd-server
        namespace: argocd
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`{{ argocd_hostname }}`)"
            priority: 10
            services:
              - name: argocd-server
                port: 80
          - kind: Rule
            match: "Host(`{{ argocd_hostname }}`) && Header(`Content-Type`, `application/grpc`)"
            priority: 11
            services:
              - name: argocd-server
                port: 80
                scheme: h2c
        tls: {}
  become: yes

- name: Create repository secret
  kubernetes.core.k8s:
    state: present
    namespace: argocd
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
        name: repo-{{ item.name }}
      data:
        enableLfs: "{{ item.enable_lfs | b64encode }}"
        project: "{{ item.project | b64encode }}"
        sshPrivateKey: "{{ item.ssh_private_key | b64encode }}"
        type: "{{ item.type | b64encode }}"
        url: "{{ item.url | b64encode }}"
  become: yes
  loop: "{{ argocd_repos }}"

- name: Create apps
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.app_namespace | default('argocd') }}"
      spec:
        destination:
          namespace: "{{ item.destination_namespace }}"
          server: https://kubernetes.default.svc
        project: default
        source:
          directory:
            jsonnet: {}
            recurse: true
          path: "{{ item.repo_path }}"
          repoURL: "{{ item.repo_url }}"
          targetRevision: "{{ item.repo_target_revision | default('main') }}"
        syncPolicy:
          automated:
            prune: "{{ item.auto_prune | default(False) }}"
            selfHeal: "{{ item.self_heal | default(False) }}"
          syncOptions: "{{ item.sync_options | default([]) }}"
      status: {}
  loop: "{{ argocd_apps }}"
  become: yes
