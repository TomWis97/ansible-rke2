---
- name: Pre-install | Get Systemd facts
  ansible.builtin.service_facts:
  become: yes

- name: Pre-install | Get Yum facts
  ansible.builtin.package_facts:

- name: Pre-install | Disable nm-cloud-setup units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: no
    state: stopped
  when: "'nm-cloud-setup.service' in ansible_facts.services"
  loop:
    - nm-cloud-setup.service
    - nm-cloud-setup.timer
  become: yes

- name: Pre-install | Place NetworkManager config
  ansible.builtin.copy:
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:flannel*
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload NetworkManager
    - Reboot if old NetworkManager
  become: yes

- name: Pre-install | Install required packages
  ansible.builtin.yum:
    name:
      - iptables
      - tar
      - python3-pip
      - python3-firewall
      # EL10 images ship without the xt_* netfilter match/target modules (incl. nft_compat),
      # which live in this package rather than the base kernel. Without it, iptables-nft rules
      # used by kube-proxy, Calico's Felix, and CNI hostPort (portmap) all fail at runtime.
      - kernel-modules-extra
    state: installed
  become: yes

- name: Pre-install | Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present
    persistent: present
  become: yes

- name: Pre-install | Install required PIP modules
  ansible.builtin.pip:
    name:
      - kubernetes
      - oauthlib
      - requests-oauthlib
    state: latest
  become: yes

- name: Pre-install | Configure firewalld
  when:
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts['services']['firewalld.service']['state'] == 'running'
  block:
  - name: Pre-install | Allow port for metrics
    ansible.builtin.firewalld:
      port: 10250/tcp
      state: enabled
      permanent: yes
      immediate: yes
    become: yes

  - name: Pre-install | Create Firewalld zone for Calico
    ansible.builtin.firewalld:
      zone: kubeAccept
      state: present
      permanent: yes
    become: yes
    notify: Reload Firewalld

  - name: Pre-install | Configure firewalld zone target for Calico
    ansible.builtin.firewalld:
      zone: kubeAccept
      permanent: yes
      target: ACCEPT
      state: present
    become: yes
    notify: Reload Firewalld

  - name: Pre-install | Configure firewalld zone interfaces for Calico
    ansible.builtin.firewalld:
      zone: kubeAccept
      permanent: yes
      interface: "{{ item }}"
      state: enabled
    loop:
      - vxlan.calico
      - cali+
    become: yes
    notify: Reload Firewalld

- name: Pre-install | Allow ports for Calico
  ansible.builtin.firewalld:
    permanent: yes
    port: "{{ item }}"
    state: enabled
  become: yes
  notify: Reload Firewalld
  loop:
    - 5473/tcp
    - 172/tcp
    - 4789/udp
    - 9098/tcp
    - 9099/tcp

- name: Pre-install | Flush handlers
  ansible.builtin.meta: flush_handlers
