---
- name: CSI-driver-SMB | Installation
  delegate_to: "{{ groups['rke2_server'][0] }}"
  run_once: yes
  block:
  - name: CSI-driver-SMB | Add Helm repo
    environment:
      PATH: "{{ ansible_facts.env.PATH }}:/usr/local/bin"
    kubernetes.core.helm_repository:
      name: csi-driver-smb
      repo_url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
    become: yes

  - name: CSI-driver-SMB | Get latest version
    ansible.builtin.uri:
      url: https://api.github.com/repos/kubernetes-csi/csi-driver-smb/releases
      return_content: yes
    register: csi_smb_releases
    when: rke2_install_csi_driver_smb_version is not defined
    check_mode: false

  - name: CSI-driver-SMB | Deploy CSI driver
    environment:
      PATH: "{{ ansible_facts.env.PATH }}:/usr/local/bin"
    kubernetes.core.helm:
      name: csi-driver-smb
      chart_ref: csi-driver-smb/csi-driver-smb
      namespace: kube-system
      chart_version: "{{ rke2_install_csi_driver_smb_version | default(csi_smb_releases.json[0]['tag_name']) }}"
      update_repo_cache: yes
    become: yes

- name: CSI-driver-SMB | Enable virt_use_samba SEBoolean
  ansible.posix.seboolean:
    name: virt_use_samba
    state: on
    persistent: yes
  become: yes

- name: CSI-driver-SMB | Create secrets
  run_once: yes
  delegate_to: "{{ groups['rke2_server'][0] }}"
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Secret
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    definition:
      data:
        domain: "{{ item.domain | b64encode }}"
        username: "{{ item.user | b64encode }}"
        password: "{{ item.password | b64encode }}"
  loop: "{{ rke2_smb_credentials }}"
  become: yes
