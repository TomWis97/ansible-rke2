---
- name: RKE2 Server | Place configation
  ansible.builtin.template:
    src: server-config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0660"
  become: yes
  notify: Restart rke2-server

- name: RKE2 Server | Enable and start Systemd service
  ansible.builtin.systemd_service:
    name: rke2-server.service
    state: started
    enabled: yes
  poll: 5
  async: 600
  become: yes
  register: rke2_server_status

- name: RKE2 Server | Wait until service is active
  ansible.builtin.systemd_service:
    name: rke2-server.service
    state: started
  retries: 30
  delay: 10
  register: result
  until: result.status.ActiveState == "active"
  become: yes

    #- name: RKE2 Server | Gather IPs of all rke2 machines
    #  ansible.builtin.set_fact:
    #    rke2_ips: "{{ rke2_ips | default([]) + [ hostvars[item]['ansible_default_ipv4']['address'] ] }}"
    #  loop: "{{ groups['rke2'] }}"

- name: RKE2 Server | Add Firewalld exceptions
  vars:
    rke2_ports:
      - 6443/tcp
      - 9345/tcp
  ansible.posix.firewalld:
    port: "{{ item }}"
    #source: "{{ item[1] }}"
    state: enabled
    permanent: yes
    immediate: yes
      #loop: "{{ rke2_ports | product(rke2_ips) }}"
  loop: "{{ rke2_ports }}"
  become: yes
