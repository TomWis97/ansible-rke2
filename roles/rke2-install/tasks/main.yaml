---
- name: Pre-installation tasks
  ansible.builtin.include_tasks: pre-install.yaml

- name: Common installation steps
  ansible.builtin.include_tasks: install_common.yaml

- name: RKE2 Server
  ansible.builtin.include_tasks: install_server.yaml
  when:
    - '"rke2_server" in group_names'

- name: RKE2 Agent
  ansible.builtin.include_tasks: install_agent.yaml
  when:
    - '"rke2_agent" in group_names'

- name: Post-installation tasks
  ansible.builtin.include_tasks: post-install.yaml
  tags:
    - post-install

- name: Kubectl
  ansible.builtin.include_tasks: kubectl.yaml

- name: Helm
  ansible.builtin.include_tasks: helm.yaml

- name: CSI-driver-SMB
  ansible.builtin.include_tasks: csi-driver-smb.yaml
  tags:
    - csi-driver-smb
  when: rke2_smb_credentials is defined

- name: Volumes
  ansible.builtin.include_tasks:
    file: volumes.yaml
    apply:
      tags:
        - volumes
  loop: "{{ rke2_hostpath_volumes }}"
  tags:
    - volumes

- name: Kube-vip Daemonset
  ansible.builtin.include_tasks: kube-vip-daemonset.yaml
  tags:
    - kube-vip
    - kube-vip-daemonset
  when:
    - "'rke2_server' in groups"
    - kubevip_enable_daemonset == True

- name: Kube-vip Static
  ansible.builtin.include_tasks: kube-vip-static.yaml
  tags:
    - kube-vip
    - kube-vip-static
  when:
    - "'rke2_server' in groups"
    - kubevip_enable_static == True
